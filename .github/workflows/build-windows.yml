name: Build Windows executable

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt nuitka

      - name: Run tests
        run: python -m pytest -q

      - name: Build hmc.exe
        run: >
          python -m nuitka --onefile --enable-plugin=tk-inter --assume-yes-for-downloads
          --output-filename=hmc.exe --include-package=pyvisa --include-package=pyvisa_py
          --include-package=serial measure.py

      - name: Smoke test the executable
        # A usage error must exit non-zero and write ERR, proving the bundled imports load.
        run: |
          .\hmc.exe 192.0.2.1 range temp 2
          if ($LASTEXITCODE -eq 0) { throw "hmc.exe accepted an invalid range command" }
          $first = Get-Content result.txt -TotalCount 1
          if ($first -ne "ERR") { throw "result.txt first line is '$first', expected ERR" }
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: hmc-exe-${{ github.sha }}
          path: hmc.exe
          if-no-files-found: error
